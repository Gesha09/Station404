<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Station 404</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .login-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 3rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            opacity: 0.7;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            opacity: 0.9;
        }
        input[type="password"] {
            width: 100%;
            padding: 0.9rem 1rem;
            background: rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        input[type="password"]:focus {
            outline: none;
            border-color: #ffaa00;
        }
        button {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #ffaa00 0%, #ff8800 100%);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255,170,0,0.4);
        }
        .error {
            background: rgba(255,68,68,0.2);
            border: 1px solid #ff4444;
            border-radius: 8px;
            padding: 0.8rem;
            margin-bottom: 1.5rem;
            text-align: center;
            color: #ff8888;
        }
        .warning {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(255,170,0,0.1);
            border: 1px solid rgba(255,170,0,0.3);
            border-radius: 8px;
            font-size: 0.85rem;
            opacity: 0.8;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>🔐 Admin Login</h1>
        <p class="subtitle">Station 404 Control Panel</p>
        
        {% if error %}
        <div class="error">❌ {{ error }}</div>
        {% endif %}
        
        <form method="POST" action="/admin/login">
            <div class="form-group">
                <label for="secret">Admin Secret</label>
                <input type="password" id="secret" name="secret" 
                       placeholder="Enter your admin secret" required autofocus>
            </div>
            <button type="submit">Login</button>
        </form>
        
        <div class="warning">
            ⚠️ This is a restricted area. All admin actions are logged.
        </div>
    </div>
</body>
</html>
