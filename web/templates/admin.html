<html lang="en">
<head>

    <title>Admin Panel</title>

        body {

            color: white;

        }
        h1 { font-size: 2.5rem; margin-bottom: 1rem; }
    </style>

<body>
    <div class="container">
        <div class="card">
            <h1>👑 Admin Panel</h1>
            <p>Welcome, admin! More features coming in Phase 2.</p>
